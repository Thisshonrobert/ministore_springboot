#member 4
spring:
  application:
    name: mini-store
  jackson:
    deserialization:
      accept-float-as-int: false
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mini_store?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:mini_store_app}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  port: ${SERVER_PORT:8080}
