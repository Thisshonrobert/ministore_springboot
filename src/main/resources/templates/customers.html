<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Customers · Mini Store</title><link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/customers.js"></script>
</head><body>
  <header th:replace="~{fragments :: nav}"></header>
  <main>
    <div class="page-header"><span class="eyebrow">THE STORE DESK / 03</span>
      <h1>Customers</h1><p class="intro">Keep customer details in one place. Select a customer on the cart page to manage their cart.</p>
    </div>
    <div id="status" role="status" aria-live="polite"></div>

<div class="workspace">
  <section class="panel"><h2 id="form-title">Add customer</h2>
    <form id="form"><label>Name<input name="name" required maxlength="100" placeholder="Customer name"></label><label>Email<input name="email" type="email" required maxlength="255" placeholder="name@example.com"></label><div class="actions"><button id="save" type="submit">Save</button><button id="cancel" type="button" class="secondary" hidden>Cancel edit</button></div></form>
  </section>
  <section class="panel list-panel"><div class="list-heading"><h2>Your customers</h2><span id="count" class="count"></span></div>
    <div class="table-wrap"><table><thead><tr><th scope="col">ID</th><th scope="col">Customer</th><th scope="col">Email</th><th scope="col">Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
    <p id="empty" class="empty" hidden>No customers yet. Add your first one using the form.</p>
  </section>
</div>

    <footer><span>MINI STORE / FOUR MEMBERS, ONE PROJECT</span><span>LOCAL MYSQL · SPRING BOOT</span></footer>
  </main>
</body></html>
