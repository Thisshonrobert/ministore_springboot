<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Products · Mini Store</title><link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/products.js"></script>
</head><body>
  <header th:replace="~{fragments :: nav}"></header>
  <main>
    <div class="page-header"><span class="eyebrow">THE STORE DESK / 02</span>
      <h1>Products</h1><p class="intro">Build a small catalog. Every product belongs to a category.</p>
    </div>
    <div id="status" role="status" aria-live="polite"></div>

<div class="workspace">
  <section class="panel"><h2 id="form-title">Add product</h2>
    <form id="form"><label>Name<input name="name" required maxlength="100" placeholder="e.g. Notebook"></label><label>Description<textarea name="description" maxlength="1000" placeholder="A few useful details"></textarea></label><label>Price (₹)<input name="price" type="number" min="0.01" max="99999999.99" step="0.01" required></label><label>Category<select name="categoryId" id="category" required><option value="">Choose a category</option></select></label><div class="actions"><button id="save" type="submit">Save</button><button id="cancel" type="button" class="secondary" hidden>Cancel edit</button></div></form>
  </section>
  <section class="panel list-panel"><div class="list-heading"><h2>Your products</h2><label class="filter">Filter<select id="filter"><option value="">All categories</option></select></label></div>
    <div class="table-wrap"><table><thead><tr><th scope="col">Product</th><th scope="col">Price</th><th scope="col">Category</th><th scope="col">Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
    <p id="empty" class="empty" hidden>No products yet. Add your first one using the form.</p>
  </section>
</div>

    <footer><span>MINI STORE / FOUR MEMBERS, ONE PROJECT</span><span>LOCAL MYSQL · SPRING BOOT</span></footer>
  </main>
</body></html>
