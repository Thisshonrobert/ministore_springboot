<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Categories · Mini Store</title><link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/categories.js"></script>
</head><body>
  <header th:replace="~{fragments :: nav}"></header>
  <main>
    <div class="page-header"><span class="eyebrow">THE STORE DESK / 01</span>
      <h1>Categories</h1><p class="intro">Give your products a place. Create a category before adding products.</p>
    </div>
    <div id="status" role="status" aria-live="polite"></div>

<div class="workspace">
  <section class="panel"><h2 id="form-title">Add category</h2>
    <form id="form"><label>Name<input name="name" required maxlength="100" placeholder="e.g. Stationery"></label><div class="actions"><button id="save" type="submit">Save</button><button id="cancel" type="button" class="secondary" hidden>Cancel edit</button></div></form>
  </section>
  <section class="panel list-panel"><div class="list-heading"><h2>Your categories</h2><span id="count" class="count"></span></div>
    <div class="table-wrap"><table><thead><tr><th scope="col">ID</th><th scope="col">Category</th><th scope="col">Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
    <p id="empty" class="empty" hidden>No categories yet. Add your first one using the form.</p>
  </section>
</div>

    <footer><span>MINI STORE / FOUR MEMBERS, ONE PROJECT</span><span>LOCAL MYSQL · SPRING BOOT</span></footer>
  </main>
</body></html>
